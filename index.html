<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#b5121b">
<meta name="description" content="Generator barcode nomor acak dengan batas pemakaian harian dan mode offline.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Barcode Generator Nomor Acak</title>
<style>
:root{font-family:Arial,sans-serif;color:#202124;background:#f3f4f6}
*{box-sizing:border-box}
body{margin:0;padding:14px;min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
@media(max-width:420px){body{padding:10px}.app{padding:18px}#qr{width:220px;height:220px}.stats{gap:7px}.stat{padding:10px 6px}}
.app{width:100%;max-width:460px;background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 28px #00000012}
h1{font-size:22px;margin:0 0 6px;color:#b5121b}
.sub{font-size:13px;color:#666;margin:0 0 20px}
.result{border:1px solid #e4e4e7;border-radius:14px;padding:18px;text-align:center;background:#fafafa}
#qr{width:230px;height:230px;margin:0 auto 14px;background:#fff;display:flex;align-items:center;justify-content:center}
#qr{width:100%;max-width:360px;height:150px;margin:0 auto 14px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
#qr img{width:100%;max-width:340px;height:130px;object-fit:contain}
.number{font-size:25px;font-weight:700;letter-spacing:1px;margin:8px 0 4px;word-break:break-all}
.small{font-size:12px;color:#666}
button{border:0;border-radius:11px;padding:14px 16px;font-size:15px;font-weight:700;cursor:pointer}
.primary{background:#b5121b;color:#fff;width:100%;margin-top:16px}
.secondary{background:#f0f0f0;color:#333;width:100%;margin-top:9px}
.manual-control{margin-top:12px}
.manual-control select{width:100%;padding:14px 12px;border:1px solid #dedede;border-radius:11px;background:#fff;font-size:15px;color:#202124}
.manual-control button{margin-top:8px}
.add-control{margin-top:12px}
.add-control input{width:100%;padding:14px 12px;border:1px solid #dedede;border-radius:11px;background:#fff;font-size:15px;color:#202124}
.add-control button{margin-top:8px}
.stats{display:flex;gap:10px;margin-top:15px}
.stat{flex:1;padding:12px;border-radius:11px;background:#f5f5f5;text-align:center}
.stat strong{display:block;font-size:20px}
.stat span{font-size:11px;color:#666}
.note{font-size:12px;color:#666;line-height:1.5;margin:16px 0 0}
.status{font-size:13px;color:#247344;min-height:18px;margin-top:10px}
</style>
</head>
<body>
<main class="app">
  <h1>Barcode Generator Nomor Acak</h1>
  

  <section class="result">
    <div id="qr" aria-label="Barcode"><span class="small">Tekan tombol untuk membuat barcode</span></div>
    <div class="number" id="number">—</div>
    <div class="small" id="counter">Belum ada nomor yang dibuat hari ini</div>
  </section>

  <button class="primary" id="generate">GENERATE BARCODE ACAK</button>
  <div class="manual-control">
    <select id="manualNumber" aria-label="Pilih nomor tertentu">
      <option value="">PILIH NOMOR TERTENTU</option>
    </select>
    <button class="secondary" id="generateManual">PANGGIL NOMOR PILIHAN</button>
  </div>
  <div class="add-control">
    <input id="newNumber" type="text" inputmode="numeric" maxlength="15"
      autocomplete="off" placeholder="Masukkan nomor baru" aria-label="Nomor baru">
    <button class="secondary" id="addNumber">TAMBAH DATA NOMOR</button>
    <button class="secondary" id="deleteNumber">HAPUS NOMOR TERPILIH</button>
    <div class="small" id="dataCount"></div>
  </div>
  <button class="secondary" id="copy">SALIN NOMOR</button>
  <div class="status" id="status" role="status"></div>

  <div class="stats">
    <div class="stat"><strong id="used">0</strong><span>Nomor sudah terpakai</span></div>
    <div class="stat"><strong id="available">24</strong><span>Nomor masih tersedia</span></div>
    <div class="stat"><strong id="total">120</strong><span>Sisa kuota hari ini</span></div>
  </div>
</main>

const CODE128_PATTERNS = ["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
function makeCode128DataUri(value){
  const codes = [104, ...Array.from(value).map(ch => ch.charCodeAt(0) - 32)];
  let checksum = codes[0];
  for(let i=1;i<codes.length;i++) checksum += codes[i]*i;
  codes.push(checksum % 103, 106);
  let x=12;
  const rects=[];
  for(const code of codes){
    let bar=true;
    for(const widthChar of CODE128_PATTERNS[code]){
      const w=Number(widthChar)*2;
      if(bar) rects.push(`<rect x="${x}" y="0" width="${w}" height="92" fill="#111"/>`);
      x+=w; bar=!bar;
    }
  }
  const width=x+12;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="112" viewBox="0 0 ${width} 112"><rect width="100%" height="100%" fill="#fff"/>${rects.join("")}<text x="${width/2}" y="107" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#111">${value}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
function showBarcode(number){
  const display=document.getElementById("qr");
  display.innerHTML="";
  const img=document.createElement("img");
  img.src=OFFLINE_BARCODE_IMAGES[number] || makeCode128DataUri(number);
  img.alt="Barcode Code 128 nomor "+number;
  img.width=340; img.height=130;
  display.appendChild(img);
}

function refreshNumberChoices(){
  const select=document.getElementById("manualNumber");
  const selected=select.value;
  select.innerHTML='<option value="">PILIH NOMOR TERTENTU</option>';
  numbers.forEach(number=>{

  document.getElementById("dataCount").textContent=numbers.length+" nomor terdaftar";
}

const LIMIT = 5;
const STORE_KEY = "qrRandomUsageV2_clean_start";
const today = () => {
  const d = new Date();
  return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
};
function loadUsage(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
    if(saved.date !== today()) return {};
    return saved.counts || {};
  }catch(e){ return {}; }
}
let savedState = loadState();
let counts = savedState.counts || {};
let queue = savedState.queue || [];
let currentNumber = savedState.currentNumber || "";
function loadState(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
    if(saved.date !== today()) return {counts:{},queue:[],currentNumber:""};
    const cleanCounts = {};
    for(const n of numbers){
      const value = Number(saved.counts && saved.counts[n] || 0);
      cleanCounts[n] = Number.isInteger(value) ? Math.max(0, Math.min(LIMIT, value)) : 0;
    }
    const cleanQueue = Array.isArray(saved.queue)
      ? saved.queue.filter((n,i,a) => numbers.includes(n) && a.indexOf(n) === i && cleanCounts[n] < LIMIT)
      : [];
    return {
      counts: cleanCounts,
      queue: cleanQueue,
      currentNumber: numbers.includes(saved.currentNumber) ? saved.currentNumber : ""
    };
  }catch(e){ return {counts:{},queue:[],currentNumber:""}; }
}
function saveUsage(){
  localStorage.setItem(STORE_KEY, JSON.stringify({
    date:today(), counts, queue, currentNumber
  }));
}
function makeShuffledRound(){
  // Satu putaran berisi seluruh nomor yang masih memiliki jatah,
  // diacak satu kali sehingga semua mendapat giliran sebelum putaran berikutnya.
  const round = numbers.filter(n => (counts[n] || 0) < LIMIT);
  for(let i=round.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [round[i],round[j]] = [round[j],round[i]];
  }
  if(round.length > 1 && round[0] === currentNumber){
    const j = 1 + Math.floor(Math.random()*(round.length-1));
    [round[0],round[j]] = [round[j],round[0]];
  }
  return round;
}
function updateStats(){
  const used = numbers.filter(n => (counts[n] || 0) > 0).length;
  const available = numbers.filter(n => (counts[n] || 0) < LIMIT).length;
  const remaining = numbers.reduce((sum,n)=>sum + Math.max(0,LIMIT-(counts[n]||0)),0);
  document.getElementById("used").textContent = used;
  document.getElementById("available").textContent = available;
  document.getElementById("total").textContent = remaining;
}
function generate(){
  // Reset otomatis saat tanggal lokal berganti.
  const fresh = loadState();
  const dateNow = today();
  if(window.__qrLastDate !== dateNow){
    counts = fresh.counts || {};
    queue = fresh.queue || [];
    currentNumber = fresh.currentNumber || "";
    window.__qrLastDate = dateNow;
  } else {
    counts = fresh.counts || {};
  }
  const remaining = numbers.filter(n => (counts[n] || 0) < LIMIT);
  if(!remaining.length){
    document.getElementById("status").textContent = "Semua nomor sudah mencapai batas 5 kali untuk hari ini.";
    updateStats();
    return;
  }
  // Habiskan satu putaran berisi semua nomor sebelum memulai putaran acak berikutnya.
  // Nomor yang sudah mencapai 5 kali otomatis tidak dimasukkan ke putaran baru.
  queue = queue.filter(n => (counts[n] || 0) < LIMIT);
  if(!queue.length) queue = makeShuffledRound();
  currentNumber = queue.shift();
  counts[currentNumber] = (counts[currentNumber] || 0) + 1;
  saveUsage();

  showBarcode(currentNumber);
  document.getElementById("number").textContent = currentNumber;
  document.getElementById("counter").textContent = "Nomor ini sudah keluar " + counts[currentNumber] + " dari 5 kali hari ini";
  document.getElementById("status").textContent = "Barcode berhasil dibuat.";
  updateStats();
}

function addNumber(){
  const input=document.getElementById("newNumber");
  const value=input.value.trim();
  if(!/^\\d{10,15}$/.test(value)){
    document.getElementById("status").textContent="Masukkan 10 sampai 15 digit angka.";
    return;
  }
  if(numbers.includes(value)){
    document.getElementById("status").textContent="Nomor tersebut sudah terdaftar.";
    return;
  }
  deletedNumbers = deletedNumbers.filter(n => n !== value);
  saveDeletedNumbers();
  if(!extraNumbers.includes(value) && !BASE_NUMBERS.includes(value)) extraNumbers.push(value);
  numbers = [...new Set([...BASE_NUMBERS, ...extraNumbers])]
    .filter(n => !deletedNumbers.includes(n));
  saveExtraNumbers();
  if(queue.length > 0 && !queue.includes(value) && (counts[value]||0)<LIMIT){
    const pos=Math.floor(Math.random()*(queue.length+1));
    queue.splice(pos,0,value);
  }
  saveUsage();
  refreshNumberChoices();
  input.value="";
  document.getElementById("status").textContent="Nomor baru berhasil ditambahkan.";
  updateStats();
}

function generateManual(){
  const chosen = manualSelect.value;
  if(!chosen){
    document.getElementById("status").textContent = "Pilih nomor terlebih dahulu.";
    return;
  }

  // Baca kuota terkini. Pemanggilan manual ikut dihitung ke batas harian.
  const fresh = loadState();
  counts = fresh.counts || {};
  queue = Array.isArray(fresh.queue) ? fresh.queue : [];
  currentNumber = fresh.currentNumber || currentNumber;

  if((counts[chosen] || 0) >= LIMIT){
    document.getElementById("status").textContent = "Nomor ini sudah mencapai batas 5 kali hari ini.";
    updateStats();
    return;
  }

  // Keluarkan dari antrean random agar tidak langsung terpilih lagi.
  queue = queue.filter(n => n !== chosen);
  currentNumber = chosen;
  counts[chosen] = (counts[chosen] || 0) + 1;
  saveUsage();

  showBarcode(currentNumber);

  document.getElementById("number").textContent = currentNumber;
  document.getElementById("counter").textContent =
    "Nomor ini sudah keluar " + counts[currentNumber] + " dari 5 kali hari ini";
  document.getElementById("status").textContent = "Barcode nomor pilihan berhasil dibuat.";
  updateStats();
}

function deleteNumber(){
  const chosen = manualSelect.value;
  if(!chosen){
    document.getElementById("status").textContent = "Pilih nomor yang ingin dihapus terlebih dahulu.";
    return;
  }
  if(!window.confirm("Hapus nomor " + chosen + " dari daftar? Nomor ini tidak akan muncul lagi pada pilihan manual maupun random.")){
    return;
  }

  deletedNumbers.push(chosen);
  deletedNumbers = [...new Set(deletedNumbers)];
  saveDeletedNumbers();

  // Hapus dari daftar tambahan, antrean random, dan kuota hari ini.
  extraNumbers = extraNumbers.filter(n => n !== chosen);
  saveExtraNumbers();
  numbers = numbers.filter(n => n !== chosen);
  queue = queue.filter(n => n !== chosen);
  delete counts[chosen];

  if(currentNumber === chosen){
    currentNumber = "";
    document.getElementById("qr").innerHTML = '<span class="small">Nomor berhasil dihapus</span>';
    document.getElementById("number").textContent = "—";
    document.getElementById("counter").textContent = "Pilih atau generate nomor";
  }

  saveUsage();
  refreshNumberChoices();
  document.getElementById("status").textContent = "Nomor berhasil dihapus dari daftar.";
  updateStats();
}

document.getElementById("generate").addEventListener("click",generate);
document.getElementById("generateManual").addEventListener("click",generateManual);
document.getElementById("addNumber").addEventListener("click",addNumber);
document.getElementById("deleteNumber").addEventListener("click",deleteNumber);
document.getElementById("copy").addEventListener("click",async()=>{
  if(!currentNumber){document.getElementById("status").textContent="Generate nomor terlebih dahulu.";return;}
  try{await navigator.clipboard.writeText(currentNumber);document.getElementById("status").textContent="Nomor berhasil disalin.";}
  catch(e){document.getElementById("status").textContent="Salin manual nomor yang tampil di layar.";}
});
updateStats();
window.__qrLastDate = today();

// Daftarkan service worker agar aplikasi dan asetnya tersedia saat offline.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(err => {
      console.error("Service worker gagal didaftarkan:", err);
    });
  });
}
</script>
